appId: com.anonymous.isotes
---
# Repro for T22: field → outside → field, faster than the ~350ms numpad close.
# Precondition (set by hand): Expense screen, AddExpense sheet open, amount empty.
# No launchApp — keeps the running app (and its draft) as is.
- extendedWaitUntil:
    visible: "New expense"
    timeout: 5000
- takeScreenshot: 00-start

# Amount field is matched by its placeholder ("0.00", or "0" for 0-decimal currencies)
- repeat:
    times: 6
    commands:
      - tapOn:
          text: "0\\.00|0"
          index: 0
          retryTapIfNoChange: false
          waitToSettleTimeoutMs: 50
      - tapOn:
          text: "New expense"
          retryTapIfNoChange: false
          waitToSettleTimeoutMs: 50

# End on the field, so the final caret state is visible
- tapOn:
    text: "0\\.00|0"
    index: 0
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 50
- takeScreenshot: 01-after-spam
- waitForAnimationToEnd
- takeScreenshot: 02-settled
