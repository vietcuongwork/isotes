# Run and tree-read commands: ../SKILL.md "Drive" (one driver per session).
# Takes -e NEWEST_CODE, the newest trip's currency code, read right before the
# run: NEWEST_CODE=$(scripts/db.sh "SELECT currency_code FROM trips ORDER BY created_at DESC LIMIT 1")
appId: com.anonymous.isotes
name: create-trip
---
# Cold start: only a relaunch leaves a trip screen for the start screen.
- launchApp
- evalScript: ${const p = (n) => String(n).padStart(2, '0'); const d = new Date(); output.tripName = 'Flow create-trip ' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes())}

- tapOn: "Start your first trip"
# The default currency is the newest trip's
- assertVisible: "Currency, .*, ${NEWEST_CODE}"

# An empty name is refused, and nothing is created
- tapOn: "Create trip"
- assertVisible: "Give the trip a name to continue\\."

# Name and note; Return on the note opens the currency sheet
- tapOn: "Kyoto in spring"
- inputText: ${output.tripName}
- pressKey: Enter
- inputText: "Flow description"
- pressKey: Enter
# Keep the default currency. The newest trip's code is the first chip, selected;
# "[^,]+" keeps the row ("name, code, symbol") and the button out of the match
- assertVisible:
    text: "[^,]+, ${NEWEST_CODE}"
    selected: true
# The X: the scrim's centre is under the tall sheet, so tapping "Close sheet" would hit a row
- tapOn: "Close currency sheet"
- assertVisible: "Currency, .*, ${NEWEST_CODE}"
- tapOn: "Create trip"

# Lands on the new trip's empty expense tab
- extendedWaitUntil:
    visible:
      text: "Expenses, tab, 1 of 3"
      selected: true
    timeout: 5000
- assertVisible: ${output.tripName}
- assertVisible: "Created .* · ${NEWEST_CODE}"
- assertVisible: "No expenses yet"
